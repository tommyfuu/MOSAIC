### GLOBAL VARS ###
rules_to_run: 'all_rw'

data_source: 'CMD'

src: './data'

dataset_name: 'crc_8_CMD'

datatype: 'relab'

### PREPROCESSING PHASE ###
CMD_datasets: ["FengQ_2015", "HanniganGD_2017", "ThomasAM_2018a", "YachidaS_2019", "ZellerG_2014"]
CMD_conditions: ["adenoma", "healthy"]

RW_LIBSIZE_THRESHOLD: 0.05
RW_RELAB_THRESHOLD: 0.05

COVAR_L: ["disease", "gender", "age"]

### BENCHMARK PHASE ###
post_integration_outputs: './trial_rw/benchmarked_results'
post_integration_outputs_nocovar: './trial_rw/benchmarked_results_nocovar'
run_nocovar_for_rf: True
used_R_methods: ["combat", "limma", "MMUPHin", 'ConQuR_rel', "bmc", "bat", "rbe", "svd", "ruv3"]
used_Python_methods: ['harmony', "debiasm", "percentile_norm"]
batch_ref: 'FengQ_2015'
covar: ["disease", "gender", "age"]
condition_value: 'adenoma'

### EVALUATION PHASE ###
evaluation_outputs: './trial_rw/outputs'
binarizing_agent: 'adenoma'
